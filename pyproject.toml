[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bifurx"
version = "0.1.0"
description = "Numerical continuation and bifurcation analysis in JAX (A modern reimagining of AUTO-07P)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Ryosuke Yoneda", email = "13e.e.c.13@gmail.com" },
]
dependencies = [
    "jax",
    "jaxlib",
    "equinox",
    "lineax",
    "numpy",
    "matplotlib",
]

[dependency-groups]
dev = [
    "ruff",
    "pyrefly",
    "pre-commit",
]
test = [
    "pytest",
    "pytest-cov",
    "scipy",
]
docs = [
    "jupyter-book>=2.0",
    "matplotlib",
]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
search-path = ["src"]
python-version = "3.14"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
